plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mokofile.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.mokofile.app"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "MokoFile-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.activity:activity:1.9.3'
}

// Готовые APK складываются в ..\builds (папка nichevo\builds)
def exportDir = rootProject.file("../builds")

tasks.register("exportDebugApk", Copy) {
    dependsOn "assembleDebug"
    from layout.buildDirectory.dir("outputs/apk/debug")
    include "*.apk"
    into exportDir
    doLast {
        println "APK: " + new File(exportDir, "MokoFile-${android.defaultConfig.versionName}-debug.apk")
    }
}

tasks.register("exportReleaseApk", Copy) {
    dependsOn "assembleRelease"
    from layout.buildDirectory.dir("outputs/apk/release")
    include "*.apk"
    into exportDir
}
